<!DOCTYPE html>
<html lang="es">
<head>
  <title>Juego Cazando</title>
  <link rel="stylesheet" href="cazando.css">
  <script src="utils.js"></script>
</head>
<body onload="iniciarJuego()">

  <div class="game-container">
      <h1 class="neon-text">Juego Cazando</h1>
      <p class="author">Autor: CRISTIAN DAHUA</p>
      
     <div class="panel">
        <div class="marcador">
          <span class="etiqueta">⭐ PUNTOS</span>
          <span id="puntos" class="valor highlight-puntos">0</span>
        </div>
        
        <div class="marcador">
          <span class="etiqueta">⏱️ TIEMPO</span>
          <span id="tiempo" class="valor highlight-tiempo">10</span>
        </div>
      </div>

      <canvas id="areaJuego" width="500" height="500"></canvas>

      <div class="controles">
        <button onclick="moverArriba()">⬆</button>
        <br>
        <button onclick="moverIzquierda()">⬅</button>
        <button onclick="moverAbajo()">⬇</button>
        <button onclick="moverDerecha()">➡</button>
      </div>
      
      <button class="btn-reiniciar" onclick="reiniciarJuego()">REINICIAR</button>
      <p id="mensaje"></p>
  </div>

  <script src="cazando.js"></script>
</body>
</html>
